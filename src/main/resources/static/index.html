<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>AutoDocs - Mf.nandes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h2>Gerador de Termos</h2>
    
    <form id="docForm">
        <div class="input-group">
            <label for="userName">Colaborador</label>
            <input type="text" id="userName" placeholder="Nome completo" required>
        </div>
        
        <div class="row">
            <div class="input-group">
                <label for="dataInicio">Data Início</label>
                <input type="date" id="dataInicio" required>
            </div>
            <div class="input-group">
                <label for="dataTermino">Data Término</label>
                <input type="date" id="dataTermino" required>
            </div>
        </div>

        <div class="input-group">
            <label for="tipoDoc">Tipo de Documento</label>
            <select id="tipoDoc" required>
                <option value="Termo de Responsabilidade">Termo de Responsabilidade</option>
                <option value="Termo de Confidencialidade">Termo de Confidencialidade</option>
                <option value="Termo de Uso">Termo de Uso de Equipamento</option>
            </select>
        </div>

        <div class="input-group">
            <label for="equipo">Equipamento / Patrimônio</label>
            <input type="text" id="equipo" placeholder="Ex: Notebook Dell Latitude" required>
        </div>

        <button type="button" id="btnGenerate" class="btn-primary">Gerar e Baixar</button>
        <div id="loader" class="loader hidden"></div>
    </form>

    <div id="resultArea" class="hidden">
        <div class="success-banner">
            <p id="document-preview"></p>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
