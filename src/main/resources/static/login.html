<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>AutoDocs — Login</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00ff88;
            --primary-dim: #00cc6a;
            --bg: #0a0f1e;
            --card: #111827;
            --text: #e2e8f0;
            --muted: #64748b;
            --border: #1e2d45;
            --danger: #ff4455;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Syne', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        body::before {
            content: '';
            position: fixed; inset: 0;
            background-image:
                linear-gradient(rgba(0,255,136,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,255,136,0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
        }
        body::after {
            content: '';
            position: fixed;
            width: 500px; height: 500px;
            background: radial-gradient(circle, rgba(0,255,136,0.06) 0%, transparent 70%);
            top: -100px; right: -100px;
            pointer-events: none;
        }
        .wrapper {
            width: 100%; max-width: 420px; padding: 24px;
            position: relative; z-index: 1;
            animation: fadeUp 0.4s ease forwards;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .logo {
            display: flex; align-items: center; gap: 12px;
            justify-content: center; margin-bottom: 40px;
        }
        .logo-icon {
            width: 38px; height: 38px; background: var(--primary);
            border-radius: 8px; display: flex; align-items: center;
            justify-content: center; font-family: 'JetBrains Mono', monospace;
            font-weight: 700; font-size: 15px; color: #0a0f1e;
            box-shadow: 0 0 20px rgba(0,255,136,0.3);
        }
        .logo h1 { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; }
        .logo span { color: var(--primary); }
        .card {
            background: var(--card); border: 1px solid var(--border);
            border-radius: 16px; padding: 36px 32px;
            box-shadow: 0 24px 60px rgba(0,0,0,0.4);
        }
        .card-header { margin-bottom: 28px; }
        .card-header h2 { font-size: 20px; font-weight: 800; }
        .card-header p { font-size: 13px; color: var(--muted); margin-top: 5px; }
        .input-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 18px; }
        label { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.8px; }
        input {
            background: var(--bg); border: 1px solid var(--border);
            color: var(--text); border-radius: 8px; padding: 11px 14px;
            font-size: 13px; font-family: 'Syne', sans-serif; width: 100%;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(0,255,136,0.08); }
        input::placeholder { color: var(--muted); }
        button[type="submit"] {
            width: 100%; padding: 12px; background: var(--primary); color: #0a0f1e;
            border: none; border-radius: 8px; font-family: 'Syne', sans-serif;
            font-size: 13px; font-weight: 700; cursor: pointer; margin-top: 6px;
            transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
        }
        button[type="submit"]:hover { background: var(--primary-dim); transform: translateY(-1px); box-shadow: 0 6px 20px rgba(0,255,136,0.25); }
        button[type="submit"]:active { transform: translateY(0); }
        .alert {
            display: none; align-items: center; gap: 8px; border-radius: 8px;
            padding: 10px 14px; font-size: 12px; font-weight: 600; margin-top: 16px;
        }
        .alert.error   { background: rgba(255,68,85,0.08); border: 1px solid rgba(255,68,85,0.25); color: var(--danger); }
        .alert.success { background: rgba(0,255,136,0.08); border: 1px solid rgba(0,255,136,0.25); color: var(--primary); }
        .alert.visible { display: flex; }
        .divider {
            display: flex; align-items: center; gap: 12px;
            margin: 24px 0; font-size: 11px; color: var(--muted);
        }
        .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }
        .register-link { text-align: center; font-size: 13px; color: var(--muted); }
        .register-link a { color: var(--primary); text-decoration: none; font-weight: 700; }
        .register-link a:hover { text-decoration: underline; }
        .footer-note {
            text-align: center; margin-top: 28px;
            font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--border);
        }
    </style>
</head>
<body>
<div class="wrapper">
    <div class="logo">
        <div class="logo-icon">AD</div>
        <h1>Auto<span>Docs</span></h1>
    </div>
    <div class="card">
        <div class="card-header">
            <h2>Bem-vindo de volta</h2>
            <p>Insira suas credenciais para acessar o sistema.</p>
        </div>
        <form action="/login" method="POST">
            <div class="input-group">
                <label>E-mail</label>
                <input type="text" name="email" placeholder="seu@email.com" required autofocus>
            </div>
            <div class="input-group">
                <label>Senha</label>
                <input type="password" name="senha" placeholder="••••••••" required>
            </div>
            <button type="submit">Entrar no sistema</button>
            <div class="alert error"   id="error-msg">⚠ Usuário ou senha inválidos.</div>
            <div class="alert success" id="success-msg">✅ Conta criada! Faça login para continuar.</div>
        </form>
        <div class="divider">ou</div>
        <p class="register-link">Não tem uma conta? <a href="/register.html">Criar agora →</a></p>
    </div>
    <p class="footer-note">AutoDocs v2.1.0 — Gerenciador de Ativos</p>
</div>
<script src="/js/login.js"></script>
</body>
</html>
