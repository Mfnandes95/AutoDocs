spring.application.name=AutoDocs

# ── Servidor ──
# A porta pode ser injetada. Excelente para deploys na nuvem (Render, Railway).
server.port=${PORT:8080}
# Em produção (HTTPS), a variável SECURE_COOKIE deve ser 'true'
server.servlet.session.cookie.secure=${SECURE_COOKIE:false}
server.servlet.session.cookie.same-site=lax

# ── Banco de Dados (PostgreSQL) ──
# A sintaxe ${VAR:padrao} tenta ler a variável do sistema operacional. Se não achar, usa o padrão.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/autodocs}
spring.datasource.username=${DB_USER:marcos}
spring.datasource.password=${DB_PASS:admin}

# ── JPA / Hibernate ──
# No dia a dia (dev) fica 'update'. Quando for para o servidor, injete a variável DDL_AUTO=validate
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ── Controle de Migrações (Flyway) ──
# Como adicionamos o Flyway no Gradle, deixamos ele desligado no ambiente de testes inicial
# até você criar a pasta src/main/resources/db/migration.
spring.flyway.enabled=${FLYWAY_ENABLED:false}

# ── Logging ──
# Mantém DEBUG no ambiente de testes, mas permite virar INFO ou ERROR em produção via infra
logging.level.org.springframework.security=${LOG_SECURITY:DEBUG}