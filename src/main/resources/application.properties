spring.application.name=AutoDocs

# ── Servidor ──
server.port=${PORT:8080}

# ── Banco — Railway fornece PGHOST, PGPORT, PGDATABASE, PGUSER, PGPASSWORD ──
spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:autodocs}
spring.datasource.username=${PGUSER:marcos}
spring.datasource.password=${PGPASSWORD:admin123}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA ──
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ── Remove o warning do dialeto ──
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect